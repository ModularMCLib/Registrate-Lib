jar {
    exclude "**/.cache"
    exclude "**/SimplifiedToTraditional.properties"
}

tasks.named('assemble') {
    dependsOn(':localization-processor:jar')
}

tasks.register('slimJar', Jar) {
    dependsOn("classes")
    archiveClassifier = "slim"
    from sourceSets.main.output
}

java {
    withSourcesJar()
}

// Include expanded Java sources alongside the Kotlin sources.
sourcesJar {
    exclude {
        sourceSets.main.allSource.contains(it.file) && it.file.name.endsWith('.java')
    }
    from(delombok) {
        include '**/*.java'
    }
}

base {
    archivesName = "${project.name}-${libs.versions.minecraft.get()}"
}

afterEvaluate {
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
        destinationDirectory = file('build/libs/')
        manifest.attributes([
                'Specification-Title': project.name,
                'Specification-Version': mod_version,
                'Specification-Vendor': 'ModularMCLib Team',
                'Implementation-Title': base.archivesName,
                'Implementation-Version': version,
                'Implementation-Vendor': 'ModularMCLib Team',
        ])
    }
}
