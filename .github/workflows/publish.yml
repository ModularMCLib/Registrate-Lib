  # After successful release, PR version bump and changelog
  bump-version-and-changelog:
    name: Bump Version and Build Changelog
    needs: [ build, upload-release-artifacts ]
    concurrency:
      group: release-update-${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.version }}
          fetch-depth: 0
      - name: Bump Version
        env:
          RELEASE_BRANCH: ${{ inputs.version }}
          RELEASE_VERSION: ${{ needs.build.outputs.ver }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "gh/release-$RELEASE_BRANCH"
          current=$(sed -nE 's/^mod_version[[:blank:]]*=[[:blank:]]*(.*)$/\1/p' gradle.properties)
          if [[ $current == "$RELEASE_VERSION" ]]; then
            bumped=$(awk 'BEGIN { FS = OFS = "." } { $NF++; print }' <<< "$RELEASE_VERSION")
            sed -i -E "s/^(mod_version[[:blank:]]*=[[:blank:]]*).*/\1$bumped/" gradle.properties
            git commit -m "Bump version to $bumped" -- gradle.properties
          fi
      - name: Prepend to CHANGELOG
        if: inputs.changelog-body != ''
        env:
          CHANGELOG_BODY: ${{ inputs.changelog-body }}
          RELEASE_VERSION: ${{ needs.build.outputs.ver }}
        run: |
          if git grep -Fq "## Version [v$RELEASE_VERSION](" -- CHANGELOG.md; then
            exit 0
          fi
          {
            head -n 2 CHANGELOG.md
            printf '%s\n' "$CHANGELOG_BODY"
            tail -n +3 CHANGELOG.md
          } > changelog.tmp
          mv changelog.tmp CHANGELOG.md
          git commit -m 'Updated CHANGELOG' -- CHANGELOG.md
      - name: Push and PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.version }}
        run: |
          if git diff --quiet "refs/remotes/origin/$RELEASE_BRANCH" HEAD; then
            exit 0
          fi
          pr_branch="gh/release-$RELEASE_BRANCH"
          git push --force-with-lease origin "HEAD:refs/heads/$pr_branch"
          pull_request=$(gh pr list --base "$RELEASE_BRANCH" --head "$pr_branch" --json number --jq '.[0].number // empty')
          if [[ -z $pull_request ]]; then
            gh pr create --base "$RELEASE_BRANCH" --head "$pr_branch" --title "RELEASE for $RELEASE_BRANCH [no-snapshot]" \
              --body 'Created by GH Workflow' --label 'ignore changelog'
          fi
