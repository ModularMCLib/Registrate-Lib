name: Publish on Release

on:
  release:
    types: [released]

jobs:
  meta:
    name: Metadata
    if: endsWith(github.ref_name, '-26.1') || endsWith(github.ref_name, '-1.21')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Get Config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          sparse-checkout: .github/json
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          token: ${{ github.token }}
          configuration: "./.github/json/config${{ endsWith(github.ref_name, '-1.21') && '-1.21' || '' }}.json"
          ignorePreReleases: true
          fetchViaCommits: true
          failOnError: true

  publish-26:
    name: '26.1'
    needs: meta
    if: endsWith(github.ref_name, '-26.1')
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'ModularMCLib' }}
      tag-name: ${{ github.ref_name }}
      version: '26.1'
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.changelog }}

  publish-21:
    name: '1.21.1'
    needs: meta
    if: endsWith(github.ref_name, '-1.21')
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'ModularMCLib' }}
      tag-name: ${{ github.ref_name }}
      version: '1.21'
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.changelog }}
