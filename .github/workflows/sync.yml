name: Sync Github Folder

on:
  push:
    branches: ['26.1']
    paths: ['.github/**']

jobs:
  sync-21:
    name: Sync to 1.21
    concurrency: workflow-sync-1.21
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.21'
          fetch-depth: 0
      - name: Copy .github from 26.1 and open pull request
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c gh/workflow-sync-1.21
          git restore --source=origin/26.1 --staged --worktree -- .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sync Workflows'
          git push --force-with-lease origin HEAD:refs/heads/gh/workflow-sync-1.21
          pull_request=$(gh pr list --base 1.21 --head gh/workflow-sync-1.21 --json number --jq '.[0].number // empty')
          if [[ -z $pull_request ]]; then
            gh pr create --base 1.21 --head gh/workflow-sync-1.21 --title 'Sync Workflows with 26.1 [no-snapshot]' \
              --body 'Created by GH Workflow' --label 'ignore changelog'
          fi
